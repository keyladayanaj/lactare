<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar sua senha — Lactare</title>
    <link rel="stylesheet" href="../../assets/css/recuperar-senha.css">
</head>
<body class="recuperar-senha-page">
    <main class="recovery-page">
        <section class="recovery-card" aria-labelledby="recovery-title">
            <div class="recovery-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    <circle cx="12" cy="15" r="1"></circle>
                </svg>
            </div>

            <h1 id="recovery-title">Recuperar sua senha</h1>

            <p class="recovery-description">
                Informe o seu e-mail cadastrado para receber as instruções de redefinição de senha.
            </p>

            <form class="recovery-form" id="recovery-form">
                <label class="recovery-label" for="recovery-email">E-mail</label>

                <div class="recovery-email-wrap">
                    <svg class="recovery-email-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="m4 7 8 6 8-6"></path>
                    </svg>
                    <input
                        class="recovery-email"
                        id="recovery-email"
                        type="email"
                        placeholder="Digite seu e-mail cadastrado"
                        autocomplete="email"
                        required
                    >
                </div>

                <button class="recovery-submit" type="submit">
                    ENVIAR INSTRUÇÕES
                </button>

                <div class="recovery-status" id="recovery-status" hidden aria-live="polite"></div>
            </form>

            <div class="recovery-divider"><span>ou</span></div>

            <button class="recovery-back" type="button" onclick="history.back()">
                Voltar para o login
            </button>
        </section>
    </main>

    <script>
        document.getElementById('recovery-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const email = document.getElementById('recovery-email').value.trim();
            const status = document.getElementById('recovery-status');
            if (!email) return;
            status.hidden = false;
            status.textContent =
                'Se o e-mail estiver cadastrado no Lactare, enviaremos as instruções para redefinição da sua senha.';
        });
    </script>
</body>
</html>
